version: "3.9"

services:
  frontend:
    image: portfolio-next
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:4000
    depends_on:
      - api
    networks:
      - devsecops-net

  api:
    image: portfolio-api
    build: ./api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    networks:
      - devsecops-net

networks:
  devsecops-net:
    driver: bridge
